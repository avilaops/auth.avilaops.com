name: Contrato MCP central
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: avl431_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test -d avl431_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://auth_test:synthetic_test_only@localhost:5432/avl431_test
      TEST_MCP_DATABASE_URL: postgresql://auth_test:synthetic_test_only@localhost:5432/avl431_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node --experimental-strip-types --import ./tests/register.mjs --test tests/mcpBanco.test.ts
